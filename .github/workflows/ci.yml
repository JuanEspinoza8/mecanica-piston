name: CI

on:
  push:
    branches: [production, develop]
  pull_request:

jobs:
  ci:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # El build no necesita credenciales: las variables de Supabase se leen en runtime
      - run: npm run build
